name: TurnCall two missing artifacts

on:
  push:
    paths:
      - '.github/workflows/turncall-two-missing-artifacts.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact missing binaries
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 -o out/listenablefuture-1.0.jar \
            https://repo1.maven.org/maven2/com/google/guava/listenablefuture/1.0/listenablefuture-1.0.jar
          curl -fL --retry 3 -o out/graphics-shapes-release.aar \
            https://dl.google.com/dl/android/maven2/androidx/graphics/graphics-shapes-android/1.0.1/graphics-shapes-release.aar
          sha256sum out/* | tee SHA256SUMS.txt
          file out/*
          ls -lh out/*

      - uses: actions/upload-artifact@v4
        with:
          name: turncall-two-missing-artifacts
          path: |
            out/listenablefuture-1.0.jar
            out/graphics-shapes-release.aar
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
