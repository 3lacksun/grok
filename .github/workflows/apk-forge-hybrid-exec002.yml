name: APK Forge Hybrid EXEC002 Build

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore APK Forge source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          echo "f86c207a6a0349874ebe578f0f8977d5f1e5560f93e000f16e0c0056ef32db34  apkforge-source.tar.gz.b64" | sha256sum -c -
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          echo "8703f1223131a456c11c6acd54b1c623e286f026c0f2ecd3e0535b8e0ed0053e  apkforge-source.tar.gz" | sha256sum -c -
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          if [ -d apk-forge-build/overrides ]; then cp -a apk-forge-build/overrides/. apkforge-work/; fi

          # Package pinned Android-native AAPT2 binaries. Android extracts the matching
          # ABI into nativeLibraryDir where the embedded Apktool engine can execute it.
          BASE=https://github.com/ReVanced/aapt2/releases/download/v1.1.0
          fetch_aapt2() {
            ABI="$1"; ASSET="$2"; SHA="$3"
            DIR="apkforge-work/app/src/main/jniLibs/$ABI"
            mkdir -p "$DIR"
            curl --fail --location --retry 3 --retry-delay 2 "$BASE/$ASSET" -o "$DIR/libaapt2.so"
            echo "$SHA  $DIR/libaapt2.so" | sha256sum -c -
            chmod 0755 "$DIR/libaapt2.so"
          }
          fetch_aapt2 arm64-v8a aapt2-arm64-v8a 7e5ae2e1f62fc24cab14072555ffd0a1a7e1ce27e82cc1008967b835b6d8df5b
          fetch_aapt2 armeabi-v7a aapt2-armeabi-v7a 466124dc6a412c39cb970a12ccaf2df054abf6f6e63e78690cd7b6e53263bd86
          fetch_aapt2 x86 aapt2-x86 52ab9dbdff56f5498dd6bf2c6a0400509330258d6db624d4c7a850314a6df715
          fetch_aapt2 x86_64 aapt2-x86_64 46d2244c3c574979ecae452c8a32e0a25ac0184bfe29a3d805821e36401ecdcb

          FIX=apkforge-work/test-fixtures/apktool-smali
          mkdir -p "$FIX/res/values" "$FIX/smali/com/example" "$FIX/smali_classes2/com/example" "$FIX/smali_classes7/com/example" "$FIX/src/com/example" "$FIX/lib/arm64-v8a"
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.directive.test" android:versionCode="1" android:versionName="1.0"><uses-sdk android:minSdkVersion="21" android:targetSdkVersion="36"/><application android:label="Fixture"/></manifest>' > "$FIX/AndroidManifest.xml"
          printf '%s\n' 'version: 2.12.1' > "$FIX/apktool.yml"
          printf '%s\n' '<resources><string name="app_name">Fixture</string></resources>' > "$FIX/res/values/strings.xml"
          printf '%s\n' '.class public Lcom/example/A;' '.super Ljava/lang/Object;' > "$FIX/smali/com/example/A.smali"
          printf '%s\n' '.class public Lcom/example/B;' '.super Ljava/lang/Object;' > "$FIX/smali_classes2/com/example/B.smali"
          printf '%s\n' '.class public Lcom/example/G;' '.super Ljava/lang/Object;' > "$FIX/smali_classes7/com/example/G.smali"
          printf '%s\n' 'package com.example; public final class Ext {}' > "$FIX/src/com/example/Ext.java"
          printf '\177ELFfixture' > "$FIX/lib/arm64-v8a/libfixture.so"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apkforge-work/app/src/main/kotlin/net/apkforge/app/MainActivity.kt')
          text = p.read_text()
          old = 'val dirs=Files.list(root).use{s->s.filter(Files::isDirectory).toList()}'
          new = 'val dirs=Files.list(root).use{s->s.filter(Files::isDirectory).iterator().asSequence().toList()}'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('MainActivity directory collection expression is neither recognised variant')
          PY

          find apkforge-work/app/src/main/jniLibs -type f -name libaapt2.so -print -exec sha256sum {} \;

      - name: Gradle version
        working-directory: apkforge-work
        run: gradle --version

      - name: Core regression harness
        working-directory: apkforge-work
        shell: bash
        run: |
          set -o pipefail
          gradle --stacktrace --no-daemon :core:verifyCore | tee ../core-regression.txt

      - name: Compile debug Kotlin
        working-directory: apkforge-work
        run: gradle --stacktrace --no-daemon :app:compileDebugKotlin

      - name: Lint debug
        working-directory: apkforge-work
        run: gradle --stacktrace --no-daemon :app:lintDebug

      - name: Assemble debug APK
        working-directory: apkforge-work
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Create runtime rebuild fixture APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          F=runtime-fixture
          mkdir -p "$F/res/values" apkforge-work/app/src/androidTest/assets
          cat > "$F/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="net.apkforge.fixture" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="36"/>
            <application android:label="APK Forge Runtime Fixture"/>
          </manifest>
          EOF
          cat > "$F/res/values/strings.xml" <<'EOF'
          <resources><string name="fixture_text">runtime</string></resources>
          EOF
          "$BT/aapt2" compile --dir "$F/res" -o "$F/compiled.zip"
          "$BT/aapt2" link -I "$ANDROID_JAR" --manifest "$F/AndroidManifest.xml" -R "$F/compiled.zip" -o "$F/fixture.apk"
          test -s "$F/fixture.apk"
          cp "$F/fixture.apk" apkforge-work/app/src/androidTest/assets/fixture.apk
          sha256sum "$F/fixture.apk" | tee runtime-fixture-sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android runtime embedded rebuild test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          script: cd apkforge-work && gradle --stacktrace --no-daemon :app:connectedDebugAndroidTest

      - name: Verify APK identity, packaged engine, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=apkforge-work/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          unzip -l "$APK" | tee apk-contents.txt
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$ABI/libaapt2.so" apk-contents.txt
          done
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp -f core-regression.txt runtime-fixture-sha256.txt evidence/ 2>/dev/null || true
          cp -f apk-badging.txt apk-contents.txt zipalign.txt apksigner.txt apk-sha256.txt evidence/ 2>/dev/null || true
          cp -f apkforge-work/app/build/reports/lint-results-debug.html evidence/ 2>/dev/null || true
          cp -f apkforge-work/app/build/reports/lint-results-debug.xml evidence/ 2>/dev/null || true
          cp -rf apkforge-work/core/build/test-results evidence/core-test-results 2>/dev/null || true
          cp -rf apkforge-work/app/build/outputs/androidTest-results evidence/android-runtime-test-results 2>/dev/null || true
          cp -rf apkforge-work/app/build/reports/androidTests evidence/android-runtime-test-reports 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK_FORGE_HYBRID_V0_1_2_RUNTIME_VERIFIED_DEBUG
          path: apkforge-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK_FORGE_HYBRID_V0_1_2_RUNTIME_VERIFICATION_EVIDENCE
          path: evidence
          if-no-files-found: warn
          retention-days: 7
