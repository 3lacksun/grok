name: APK Forge Source Dump

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print build wiring inventory
        shell: bash
        run: |
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          for f in \
            core/src/main/kotlin/net/apkforge/core/build/ApkDecode.kt \
            app/src/main/kotlin/net/apkforge/app/build/AndroidBuildController.kt \
            app/src/main/kotlin/net/apkforge/app/security/SigningSecretStore.kt \
            app/src/main/AndroidManifest.xml \
            core/src/main/kotlin/net/apkforge/core/remote/RemoteBuildClient.kt \
            app/src/main/kotlin/net/apkforge/app/tools/ToolDownloadWorker.kt \
            app/src/main/kotlin/net/apkforge/app/settings/SettingsRepository.kt; do
              echo "=== $f ==="
              if [ -f "apkforge-work/$f" ]; then nl -ba "apkforge-work/$f"; else echo MISSING; fi
          done
          echo '=== ASSET/CONFIG INVENTORY ==='
          find apkforge-work/app/src/main -maxdepth 4 -type f | sort
          echo '=== TOOLCHAIN/CATALOGUE INVENTORY ==='
          find apkforge-work -type f | grep -Ei 'tool|catalog|keystore|sign|apktool|smali|aapt|zipalign|apksigner|android.jar' | sort | sed -n '1,240p'
