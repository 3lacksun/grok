name: APK Forge Source Dump

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print relevant UI
        shell: bash
        run: |
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          for f in \
            app/src/main/kotlin/net/apkforge/app/MainActivity.kt \
            app/src/main/kotlin/net/apkforge/app/build/AndroidBuildController.kt \
            app/src/main/kotlin/net/apkforge/app/build/BuildForegroundService.kt \
            app/src/main/kotlin/net/apkforge/app/storage/ProjectStorage.kt \
            core/src/main/kotlin/net/apkforge/core/build/BuildPlan.kt \
            core/src/main/kotlin/net/apkforge/core/build/BuildOrchestrator.kt \
            core/src/main/kotlin/net/apkforge/core/toolchain/Toolchain.kt; do
              echo "=== $f ==="
              nl -ba "apkforge-work/$f"
          done
