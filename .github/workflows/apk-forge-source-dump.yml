name: APK Forge Source Dump

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print relevant UI
        shell: bash
        run: |
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          echo '=== MAIN_ACTIVITY ==='
          nl -ba apkforge-work/app/src/main/kotlin/net/apkforge/app/MainActivity.kt
          echo '=== UI FILES ==='
          find apkforge-work/app/src/main/kotlin/net/apkforge/app -type f -name '*.kt' | sort
          echo '=== BUILD REFERENCES ==='
          grep -RniE 'Build APK|startBuild|BuildForegroundService|BuildOrchestrator|BuildsScreen|ProjectsScreen|projectId|workspace' apkforge-work/app/src/main/kotlin/net/apkforge/app || true
