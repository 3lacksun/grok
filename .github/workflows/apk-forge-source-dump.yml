name: APK Forge Source Dump

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print build wiring inventory
        shell: bash
        run: |
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          echo '=== CORE FILES ==='
          find apkforge-work/core/src/main/kotlin -type f | sort
          echo '=== APK DECODE REFERENCES ==='
          grep -RniE 'ApkDecode|decode.*apk|APKTOOL|apktool|input\.apk|baksmali' apkforge-work/core/src/main/kotlin apkforge-work/core/src/test/kotlin || true
          echo '=== TOOL INVOCATION REFERENCES ==='
          grep -RniE 'ToolInvocation\(|ToolStore\(|ToolCatalogue|SigningSecretStore|runLocal\(' apkforge-work/app/src/main/kotlin apkforge-work/core/src/main/kotlin apkforge-work/core/src/test/kotlin || true
          echo '=== PROJECT ANALYSER ==='
          nl -ba apkforge-work/core/src/main/kotlin/net/apkforge/core/project/ProjectAnalyser.kt
