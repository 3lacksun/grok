name: APK Forge Source Dump

on:
  push:
    branches:
      - apk-forge-hybrid-exec002-11092026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print relevant UI
        shell: bash
        run: |
          mkdir -p apkforge-work
          cat apk-forge-build/source-parts/part-* > apkforge-source.tar.gz.b64
          base64 -d apkforge-source.tar.gz.b64 > apkforge-source.tar.gz
          tar -xzf apkforge-source.tar.gz -C apkforge-work
          for f in \
            app/src/main/kotlin/net/apkforge/app/MainActivity.kt \
            app/src/main/kotlin/net/apkforge/app/build/AndroidBuildController.kt \
            app/src/main/kotlin/net/apkforge/app/tools/ToolDownloadPolicy.kt \
            app/src/main/kotlin/net/apkforge/app/tools/ToolDownloadWorker.kt \
            app/src/main/kotlin/net/apkforge/app/settings/SettingsRepository.kt \
            core/src/main/kotlin/net/apkforge/core/model/Models.kt \
            core/src/main/kotlin/net/apkforge/core/project/ApkDecodePlanner.kt \
            core/src/main/kotlin/net/apkforge/core/project/ProjectCodec.kt \
            core/src/main/kotlin/net/apkforge/core/build/BuildPlan.kt; do
              echo "=== $f ==="
              if [ -f "apkforge-work/$f" ]; then nl -ba "apkforge-work/$f"; else echo MISSING; fi
          done
