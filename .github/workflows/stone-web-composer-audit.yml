name: STONE WEB Composer Audit

on:
  push:
    paths:
      - 'stone-web-composer-audit/**'
      - '.github/workflows/stone-web-composer-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl
          tools: composer:v2
      - name: Resolve and audit
        working-directory: stone-web-composer-audit
        env:
          COMPOSER_NO_AUDIT: '0'
        run: |
          composer update --no-dev --prefer-dist --no-interaction --no-progress
          composer audit
