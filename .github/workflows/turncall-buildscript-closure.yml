name: TurnCall buildscript closure resolver

on:
  push:
    paths:
      - '.github/workflows/turncall-buildscript-closure.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create exact buildscript resolver
        run: |
          mkdir -p pluginresolver
          cat > pluginresolver/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          rootProject.name='TurnCallBuildscriptResolver'
          EOF
          cat > pluginresolver/build.gradle <<'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.13.2'
              classpath 'com.google.gms:google-services:4.4.4'
              classpath 'io.github.gradle-nexus:publish-plugin:1.3.0'
            }
          }
          tasks.register('materialiseBuildscript') {
            doLast {
              buildscript.configurations.classpath.files.each { println "MATERIALISED ${it.name}" }
            }
          }
          EOF

      - name: Resolve and materialise exact buildscript closure
        working-directory: pluginresolver
        run: gradle --no-daemon --refresh-dependencies materialiseBuildscript

      - name: Package files store
        run: |
          test -d "$HOME/.gradle/caches/modules-2/files-2.1"
          cd "$HOME/.gradle/caches/modules-2"
          zip -q -r "$GITHUB_WORKSPACE/turncall-buildscript-files-2.1.zip" files-2.1
          cd "$GITHUB_WORKSPACE"
          sha256sum turncall-buildscript-files-2.1.zip > turncall-buildscript-files-2.1.zip.sha256
          split -b 70M -d -a 2 turncall-buildscript-files-2.1.zip turncall-buildscript-files-2.1.zip.part-
          sha256sum turncall-buildscript-files-2.1.zip.part-* > turncall-buildscript-files-2.1.parts.sha256
          ls -lh turncall-buildscript-files-2.1.zip*

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: turncall-buildscript-files-part-00
          path: |
            turncall-buildscript-files-2.1.zip.part-00
            turncall-buildscript-files-2.1.zip.sha256
            turncall-buildscript-files-2.1.parts.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload part 01 if present
        if: hashFiles('turncall-buildscript-files-2.1.zip.part-01') != ''
        uses: actions/upload-artifact@v4
        with:
          name: turncall-buildscript-files-part-01
          path: |
            turncall-buildscript-files-2.1.zip.part-01
            turncall-buildscript-files-2.1.zip.sha256
            turncall-buildscript-files-2.1.parts.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload part 02 if present
        if: hashFiles('turncall-buildscript-files-2.1.zip.part-02') != ''
        uses: actions/upload-artifact@v4
        with:
          name: turncall-buildscript-files-part-02
          path: |
            turncall-buildscript-files-2.1.zip.part-02
            turncall-buildscript-files-2.1.zip.sha256
            turncall-buildscript-files-2.1.parts.sha256
          compression-level: 0
          retention-days: 7
